[package]
name = "rsgments"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/memeviber/Rsgments"

[lib]
name = "_rsgments"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.28"
regex-automata = "0.4"
fancy-regex = "0.20"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
