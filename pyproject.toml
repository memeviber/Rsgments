[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "rsgments"
version = "0.3.0"
description = "Rust-accelerated state machine engine for Pygments"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "MemeViber" },
]
keywords = [
    "pygments",
    "syntax-highlighting",
    "rust",
    "lexer",
    "regex",
    "pyo3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
dependencies = [
    "pygments>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/memeviber/Rsgments"
Repository = "https://github.com/memeviber/Rsgments"
Issues = "https://github.com/memeviber/Rsgments/issues"
Releases = "https://github.com/memeviber/Rsgments/releases"

[tool.maturin]
python-source = "python"
module-name = "rsgments._rsgments"
include = [
    { path = "tests/**/*", format = "sdist" },
    { path = "bench.py", format = "sdist" },
]